apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-api
  namespace: evidence-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evidence-api
  template:
    metadata:
      labels:
        app: evidence-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: evidence-api-sa
      containers:
        - name: evidence-api
          image: acrevidenceplatform001.azurecr.io/evidence-api:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: AZURE_STORAGE_ACCOUNT
              value: "stevidenceplatform001"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
